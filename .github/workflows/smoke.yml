name: Live smoke test

# Walks the hosted demo every six hours, so anyone can see it stayed up during judging.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SITE: https://goodfaith.onrender.com
    steps:
      - name: Database answers
        run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors "$SITE/api/health"
      - name: Pages load and the ledger has real rows
        run: |
          for path in / /judges /try /replay /console; do
            curl -fsS -o /dev/null --retry 3 --retry-delay 10 "$SITE$path"
          done
          curl -fsS "$SITE/ledger" | grep -q 'Hold released'
      - name: A forged PayPal webhook is refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SITE/api/paypal/webhook" -H 'content-type: application/json' -d '{"id":"WH-FORGED","event_type":"PAYMENT.AUTHORIZATION.VOIDED","resource":{"id":"none"}}')
          test "$code" = 401
